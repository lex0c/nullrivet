name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commits because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  # Tests run natively on every platform a release ships for: processes, signals and terminals
  # behave differently between them.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 ships Bubblewrap 0.11, with the overlay options the workspace profile
          # uses: the overlay tests must run there, on both architectures.
          - os: ubuntu-latest
            overlays: true
          - os: ubuntu-26.04-arm
            overlays: true
          # Ubuntu 24.04 ships Bubblewrap 0.9, without them: the inspect profile is tested there,
          # and the overlay tests are skipped.
          - os: ubuntu-24.04
          - os: macos-15
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The sandbox tests need Bubblewrap and unprivileged user namespaces, which Ubuntu's
      # AppArmor policy restricts by default, and the network tests nftables and passt. With
      # NULLRIVET_TEST_REQUIRE_SANDBOX and NULLRIVET_TEST_REQUIRE_NETWORK set, a sandbox or a
      # network that cannot start fails those tests instead of skipping them.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap nftables passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # pasta relays ICMP echo with echo sockets of the host, which this range allows.
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          echo NULLRIVET_TEST_REQUIRE_SANDBOX=1 >> "$GITHUB_ENV"
          echo NULLRIVET_TEST_REQUIRE_NETWORK=1 >> "$GITHUB_ENV"
      - if: matrix.overlays
        run: echo NULLRIVET_TEST_REQUIRE_OVERLAY=1 >> "$GITHUB_ENV"
      - run: bun test
      # The end-to-end tests again, against the compiled executable, which resolves its embedded
      # modules differently from the sources.
      - run: bun run build
      - run: bun test tests/e2e
        env:
          NULLRIVET_EXECUTABLE: dist/nullrivet
