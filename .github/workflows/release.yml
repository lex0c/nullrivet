name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Actions are pinned to commits because a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The executable reports the version from package.json, so a tag must not disagree with it.
      - name: Check the tag against the package version
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - name: Build the executables
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            bash scripts/build.sh "bun-$target" "dist/nullrivet-$target"
          done
          (cd dist && sha256sum nullrivet-* > SHA256SUMS)
      - name: Test the Linux x64 executable
        run: bun test tests/e2e
        env:
          NULLRIVET_EXECUTABLE: dist/nullrivet-linux-x64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
